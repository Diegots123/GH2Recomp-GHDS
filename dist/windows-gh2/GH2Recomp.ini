# Configuracoes do GH2 Recomp. Linhas "chave = valor"; # comeca um comentario.

# Resolucao interna, em multiplos da do PS2 (1 a 8). A imagem continua 4:3.
upscale = 3

# Abrir em tela cheia sem bordas (F11 ou Alt+Enter alterna a qualquer momento).
fullscreen = 0

# Tamanho da janela fora da tela cheia.
window = 1280x960

# Esperar o monitor para mostrar cada quadro: sem tearing e, num monitor de 60 Hz
# (ou 120, 180, 240 Hz), cada quadro no tempo exato da tela, com um pouco mais
# de atraso.
# Com 0, o jogo segue o proprio relogio, e a tela pode repetir um quadro de vez em quando.
vsync = 0

# Com o que a placa de video desenha (o renderizador do PCSX2):
#   opengl : OpenGL (padrao).
#   d3d11  : Direct3D 11. Costuma ser o mais rapido em video integrado (Intel,
#            AMD) e em placas antigas. A primeira vez demora um pouco a abrir,
#            preparando os shaders; depois, abre na hora.
#   auto   : o que o proprio PCSX2 escolheria para a sua placa (d3d11 ou opengl).
#   sw     : em software, so com a CPU (lento; para comparar).
# Se o escolhido nao abrir, o jogo usa o OpenGL (o GH2Recomp.log diz qual abriu).
renderer = opengl

# Palco: on (padrao) ou off. Com off, so a pista, as notas, a pontuacao e o
# medidor aparecem, sobre fundo preto: palco, banda e plateia nao sao
# desenhados, o que alivia bastante placas de video fracas. O jogo roda igual
# (timing, notas e pontuacao nao mudam); so a imagem do palco some.
venue = on

# Calibracao de audio: desloca o som das musicas em relacao as notas, em
# milissegundos (de -500 a 500), como fazem as ISOs com o audio das musicas
# regravado. O disco continua sendo o original; so o que se ouve muda de hora.
#   negativo : o som sai mais cedo. Use se voce ouve a nota depois de ela
#              cruzar a linha.
#   positivo : o som sai mais tarde. Use se voce ouve a nota antes.
# Com 0 (padrao), tudo como no disco. A calibracao de lag do menu do jogo
# continua valendo junto com esta. Vale a partir da proxima vez que abrir.
audio_offset = 0

# Processador grafico do PS2 (VU1) numa thread propria: auto (padrao), on ou
# off. Com on, o VU1 roda em paralelo com o resto do jogo, o que alivia
# bastante a CPU, ate num processador de 2 threads. auto liga quando ha 2
# threads ou mais livres para o jogo. Se aparecer algum problema de imagem que
# nao existia antes, teste com off e avise.
vu1_thread = auto

# Prioridade do jogo no Windows: above_normal (padrao, "acima do normal") ou
# normal. Acima do normal, programas abertos atras (navegador, antivirus)
# esperam o jogo, e nao o contrario. Quando o jogo esta adiantado ele dorme,
# entao nao toma da CPU mais do que precisa.
priority = above_normal

# ---------------- Teclado ----------------
# (a tela do F1 no menu principal muda tudo daqui para baixo)
# O teclado comeca ligado se nenhum controle ou guitarra estiver conectado
# ao abrir o jogo, e desligado se houver um; o F1 liga e desliga depois.
#   keyboard_mode = strum  : segure o traste e palhete (o jogo ve uma guitarra)
#   keyboard_mode = nostrum: sem palhetar, como o GH2 joga com o DualShock 2
keyboard_mode = strum

# Uma tecla por acao, sem tecla repetida na mesma secao. Nomes das teclas
# como o SDL os escreve: 1, A, F2, Up, Down, Left, Right, Return, Space,
# Backspace, Tab, Left Shift, Right Shift, Left Ctrl, ... (none: nenhuma).
# F1, F11 e Escape sao reservadas. Nos menus valem as teclas de [keys.menu];
# na musica, as do modo escolhido.
[keys.strum]
green = 1
red = 2
yellow = 3
blue = 4
orange = 5
strum_up = Up
strum_down = Down
start = Return
star_power = Backspace
whammy = Right Shift

[keys.nostrum]
green = 1
red = 2
yellow = 3
blue = 4
orange = 5
start = Return
star_power = Backspace
whammy = Right Shift

[keys.menu]
up = Up
down = Down
left = Left
right = Right
confirm = Return
back = Backspace
start = Space
